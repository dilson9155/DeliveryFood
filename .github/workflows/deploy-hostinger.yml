name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:    # permite disparar manualmente pelo GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 22
          script: |
            cd /var/www/delivery-food
            bash deploy/update.sh

      - name: Notify
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy concluído: https://deliveryfood.elitesistemas.io"
          else
            echo "❌ Deploy falhou! Confira: https://github.com/dilson9155/Delivery-Food/actions"
          fi